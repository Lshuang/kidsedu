<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>幼小衔接乐园 · 多娃学习工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学习乐园">
<meta name="theme-color" content="#7EC8F5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{
  --bg:#FDF6FF;
  --primary:#7EC8F5; --primary-dk:#3FA6E8;
  --pink:#FFAEC5; --pink-dk:#F27FA0;
  --mint:#9FE6C3; --mint-dk:#4FBE8A;
  --lemon:#FFE38F; --lemon-dk:#E8B93B;
  --lav:#CBB6F5; --lav-dk:#9C7BE0;
  --text:#4A3F5E; --muted:#9A8FB0;
  --card:#FFFFFF; --radius:22px;
  --shadow:0 6px 20px rgba(158,120,220,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  background-image:
    radial-gradient(circle at 12% 18%, #FFEFF5 0 10%, transparent 11%),
    radial-gradient(circle at 88% 8%, #FFF9E3 0 9%, transparent 10%),
    radial-gradient(circle at 92% 85%, #E8FBF1 0 10%, transparent 11%),
    radial-gradient(circle at 6% 88%, #EAF4FF 0 9%, transparent 10%);
  background-attachment:fixed;
}
button{font-family:inherit}
/* ================= 头部 ================= */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;height:64px;
  background:linear-gradient(90deg,#8ED0F8,#C9B4F6,#FFB7CD);
  display:flex;align-items:center;gap:8px;padding:0 12px;
  box-shadow:0 3px 14px rgba(156,123,224,.3);
}
#logo{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;flex:0 0 auto}
#logo .m{font-size:32px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
#logo .t{color:#fff;font-weight:800;font-size:18px;letter-spacing:1px;text-shadow:0 2px 3px rgba(0,0,0,.15)}
#kidBtn{
  margin-left:auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.92);
  border:0;border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;
  font-weight:800;font-size:15px;color:var(--text);box-shadow:var(--shadow);max-width:46vw;
}
#kidBtn .av{width:34px;height:34px;border-radius:50%;background:#FFE9F1;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
#kidBtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kidBtn .ar{font-size:11px;color:var(--muted)}
#ptPill{
  background:#FFF8DF;border-radius:999px;padding:6px 13px;font-weight:800;font-size:15px;
  color:#E8930C;box-shadow:var(--shadow);display:flex;align-items:center;gap:4px;flex:0 0 auto;
}
#kidMenu{
  position:fixed;top:66px;right:10px;z-index:70;background:#fff;border-radius:20px;
  box-shadow:0 10px 34px rgba(90,60,140,.25);padding:10px;display:none;min-width:230px;
  animation:pop .18s;
}
#kidMenu.show{display:block}
#kidMenu .krow{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;cursor:pointer;
  font-weight:800;font-size:15px;
}
#kidMenu .krow:hover{background:#F6F0FF}
#kidMenu .krow.cur{background:#EFE6FF}
#kidMenu .krow .av{width:38px;height:38px;border-radius:50%;background:#FFE9F1;display:flex;align-items:center;justify-content:center;font-size:22px}
#kidMenu .krow .gd{font-size:12px;color:var(--muted);font-weight:600}
#kidMenu .add{
  margin-top:6px;border-top:2px dashed #EEE4FB;padding-top:8px;color:var(--lav-dk);
}
/* ================= 导航 ================= */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;height:64px;background:#fff;
  display:flex;box-shadow:0 -4px 18px rgba(156,123,224,.18);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;border:0;background:none;font-size:11px;color:var(--muted);cursor:pointer;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
nav button .i{font-size:24px;transition:transform .18s}
nav button.on{color:var(--lav-dk)}
nav button.on .i{transform:scale(1.22)}
/* ================= 布局 ================= */
#wrap{max-width:1150px;margin:0 auto;display:flex;min-height:100vh}
main{flex:1;width:100%;padding:76px 12px 84px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h2{font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
h3{font-size:15px;margin:14px 0 8px;color:var(--lav-dk)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.flex{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.mt{margin-top:12px}
.center{text-align:center}
/* ================= 按钮 ================= */
.btn{
  border:0;border-radius:16px;padding:12px 20px;font-size:16px;font-weight:800;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#8ED0F8,#5CB6F0);box-shadow:0 4px 0 #3E93CE;
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3E93CE}
.btn.pink{background:linear-gradient(180deg,#FFB9CE,#FF92B4);box-shadow:0 4px 0 #E06E93}
.btn.pink:active{box-shadow:0 1px 0 #E06E93}
.btn.green{background:linear-gradient(180deg,#A5E8C7,#6FD3A2);box-shadow:0 4px 0 #4BAE7E}
.btn.green:active{box-shadow:0 1px 0 #4BAE7E}
.btn.yellow{background:linear-gradient(180deg,#FFE79A,#FFD65C);box-shadow:0 4px 0 #DFAE1C;color:#7A5A00}
.btn.yellow:active{box-shadow:0 1px 0 #DFAE1C}
.btn.purple{background:linear-gradient(180deg,#D3BEF8,#B394EE);box-shadow:0 4px 0 #8B67CF}
.btn.purple:active{box-shadow:0 1px 0 #8B67CF}
.btn.gray{background:#EDE8F5;color:var(--muted);box-shadow:0 4px 0 #D5CCE6}
.btn.gray:active{box-shadow:0 1px 0 #D5CCE6}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.xs{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ================= 进度与任务 ================= */
.pbar{height:18px;background:#F1E9FF;border-radius:999px;overflow:hidden}
.pbar>div{height:100%;background:linear-gradient(90deg,#FFD65C,#FF92B4,#B394EE);border-radius:999px;transition:width .5s}
.trow{display:flex;align-items:center;gap:11px;background:#FAF6FF;border-radius:16px;padding:11px 13px;margin-bottom:9px}
.trow .ic{font-size:28px}
.trow .nm{flex:1;font-weight:800;font-size:15px}
.trow .sub{font-size:12px;color:var(--muted);font-weight:600}
.trow .pt{color:#E8930C;font-weight:800;font-size:13px;white-space:nowrap}
.done-tag{color:#4BAE7E;font-weight:800;font-size:14px;white-space:nowrap}
/* ================= 网格卡片 ================= */
.grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}
.grid.mid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.wcard{
  background:#F5FAFF;border:2.5px solid #DCEEFC;border-radius:18px;text-align:center;
  padding:11px 5px;cursor:pointer;transition:transform .12s;user-select:none;
}
.wcard:active{transform:scale(.92)}
.wcard .big{font-size:28px;font-weight:800;color:var(--primary-dk);line-height:1.25}
.wcard .sub{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:700}
.wcard.pinkish{background:#FFF5F8;border-color:#FFDFEA}
.wcard.pinkish .big{color:#F06292}
.wcard.greenish{background:#F1FBF5;border-color:#D3F2E0}
.wcard.greenish .big{color:#3EA96F}
.wcard.lemonish{background:#FFFBEB;border-color:#FFEEB5}
.wcard.lemonish .big{color:#DA9E10}
.wcard.lavish{background:#F8F4FF;border-color:#E7DBFB}
.wcard.lavish .big{color:#8B67CF}
/* ================= 学习大卡（识字/复习） ================= */
.studycard{
  background:linear-gradient(160deg,#FFFDF4,#FFF3F8);border:3px solid #FFE2EC;border-radius:26px;
  text-align:center;padding:26px 16px;margin-bottom:14px;
}
.studycard .zi{font-size:88px;font-weight:800;line-height:1.15;color:#5B4488}
.studycard .py{font-size:24px;color:#F27FA0;font-weight:800;letter-spacing:2px}
.studycard .wd{font-size:19px;margin-top:8px;font-weight:800;color:#4A3F5E}
.studycard .emo{font-size:40px;margin-top:2px}
.studycard .ops{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
/* ================= 子标签 ================= */
.subtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.subtabs button{
  flex:0 0 auto;border:0;border-radius:999px;padding:9px 15px;font-size:14.5px;font-weight:800;
  background:#fff;color:var(--muted);box-shadow:var(--shadow);cursor:pointer;
}
.subtabs button.on{background:linear-gradient(90deg,#B394EE,#8ED0F8);color:#fff}
/* ================= 古诗 ================= */
.poem{background:#FFFDF3;border:2.5px solid #FFEDB5;border-radius:20px;padding:16px;margin-bottom:13px}
.poem .pt-title{font-size:19px;font-weight:800;text-align:center}
.poem .pt-author{text-align:center;color:var(--muted);font-size:12.5px;margin:3px 0 10px}
.poem .pt-py{text-align:center;font-size:12px;color:#C99A2E;letter-spacing:.5px;margin-top:6px}
.poem .pt-line{text-align:center;font-size:17.5px;line-height:1.5;letter-spacing:3px;font-weight:700}
.poem .ops{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* ================= 数学 ================= */
.mathq{font-size:44px;font-weight:800;text-align:center;margin:16px 0;letter-spacing:4px;color:#5B4488}
.mopts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.mopts button{
  width:84px;height:84px;border-radius:24px;border:0;font-size:32px;font-weight:800;cursor:pointer;
  background:#FFF3D6;color:#B07B00;box-shadow:0 5px 0 #E8C878;transition:transform .08s;
}
.mopts button:active{transform:translateY(4px);box-shadow:0 1px 0 #E8C878}
.split{background:#F5FAFF;border:2.5px solid #DCEEFC;border-radius:18px;padding:12px;text-align:center;cursor:pointer}
.split .top{font-size:26px;font-weight:800;color:#3FA6E8}
.split .pair{display:flex;justify-content:center;gap:18px;margin-top:6px;font-size:20px;font-weight:800}
.split .pair span{background:#FFF;border-radius:12px;padding:2px 12px;border:2px solid #E7DBFB;color:#8B67CF}
.split .dots{font-size:12px;letter-spacing:1px;margin-top:5px;line-height:1.4}
/* ================= 统计块 ================= */
.stats{display:flex;gap:9px;flex-wrap:wrap}
.stats .st{flex:1;min-width:88px;background:#FAF6FF;border-radius:16px;padding:11px 6px;text-align:center}
.stats .st b{display:block;font-size:22px;color:var(--lav-dk)}
.stats .st span{font-size:11.5px;color:var(--muted);font-weight:700}
/* ================= 商城 ================= */
.shop-item{display:flex;align-items:center;gap:12px;background:#FFF8FA;border:2px solid #FFE4EC;border-radius:18px;padding:13px;margin-bottom:11px}
.shop-item .ic{font-size:34px}
.shop-item .info{flex:1}
.shop-item .info b{font-size:15.5px}
.shop-item .cost{color:#F06292;font-weight:800;font-size:13px;margin-top:2px}
.coupon{
  display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#FFF6D8,#FFEFF4);
  border:2px dashed #FFC93C;border-radius:16px;padding:11px;margin-bottom:9px;
}
.cat-tag{display:inline-block;background:#F1E9FF;color:#8B67CF;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;margin:0 6px 8px 0}
/* ================= 勋章 ================= */
.badges{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
.bcard{background:#fff;border-radius:18px;padding:15px 8px;text-align:center;box-shadow:var(--shadow)}
.bcard .bi{font-size:42px}
.bcard.lock{filter:grayscale(1);opacity:.5}
.bcard b{display:block;font-size:14px;margin-top:5px}
.bcard span{font-size:11.5px;color:var(--muted)}
/* ================= 电视 ================= */
.tv-clock{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--primary-dk);margin:6px 0}
/* ================= 表单 ================= */
input,select{
  border:2px solid #E7DBFB;border-radius:12px;padding:9px 11px;font-size:15px;outline:none;
  background:#fff;color:var(--text);width:100%;
}
input:focus,select:focus{border-color:var(--lav-dk)}
input.num{max-width:84px;text-align:center}
input.icon-in{max-width:60px;text-align:center}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.prow label{font-size:13.5px;font-weight:800;white-space:nowrap}
/* ================= 弹窗 / 提示 ================= */
#mask{position:fixed;inset:0;background:rgba(70,50,110,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
#mask.show{display:flex}
#modal{background:#fff;border-radius:26px;padding:24px 20px;max-width:430px;width:100%;max-height:84vh;overflow-y:auto;text-align:center;animation:pop .22s}
@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
#toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:220;
  background:rgba(74,63,94,.93);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:14.5px;font-weight:700;display:none;max-width:92vw;text-align:center;
}
.confetti{position:fixed;font-size:26px;z-index:300;pointer-events:none;animation:fall 1.5s ease-in forwards}
@keyframes fall{from{transform:translateY(-4vh) rotate(0);opacity:1}to{transform:translateY(78vh) rotate(340deg);opacity:0}}
.bounce{display:inline-block;animation:bnc 1.1s infinite}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
.shake{display:inline-block;animation:shk .5s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.voucher{
  background:linear-gradient(135deg,#FFF7DE,#FFEFF6);border:3px dashed #F7B32B;border-radius:20px;
  padding:18px;margin:10px 0;text-align:center;
}
.voucher .vt{font-size:13px;color:#C99A2E;font-weight:800;letter-spacing:4px}
.voucher .vn{font-size:20px;font-weight:800;margin:6px 0}
.voucher .vk{font-size:14px;color:#F27FA0;font-weight:800}
/* ================= 桌面端 ================= */
@media (min-width: 920px){
  nav{
    position:fixed;left:max(8px,calc(50% - 575px));top:76px;bottom:auto;width:184px;height:auto;
    flex-direction:column;border-radius:24px;padding:14px 10px;gap:4px;box-shadow:var(--shadow);
  }
  nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:12px 15px;border-radius:15px;width:100%}
  nav button.on{background:#F1E9FF}
  main{margin-left:204px;padding:88px 22px 40px}
  #logo .t{font-size:21px}
  #kidBtn{max-width:280px}
}
</style>
</head>
<body>
<header>
  <div id="logo" onclick="logoTap()"><span class="m">🐻</span><span class="t">幼小衔接乐园</span></div>
  <button id="kidBtn" onclick="toggleKidMenu(event)"></button>
  <div id="ptPill">⭐ <span id="ptNum">0</span></div>
</header>
<div id="kidMenu"></div>

<div id="wrap">
  <nav id="nav"></nav>
  <main><div id="content"></div></main>
</div>

<div id="mask" onclick="if(event.target===this&&!modalLock)closeModal()"><div id="modal"></div></div>
<div id="toast"></div>

  ['🦷','牙齿要换新','小朋友的乳牙一共二十颗，到了五六岁会慢慢松动掉落，长出更结实的新牙。好好刷牙，新牙才能又白又健康。'],

/* ==================== 语音与音效（自动优选播音级音色） ==================== */
var _voices=[];
function loadVoices(){ try{ _voices=speechSynthesis.getVoices()||[]; }catch(e){} }
try{ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
/* 音色优先级：Edge Natural 在线音色 > 系统高质量中文女声 > Google 普通话 > 任意中文 */
var VOICE_PREF_ZH=['xiaoxiao','xiaoyi','yunjian','yunxi','yunyang','huihui','yaoyao','kangkang','tingting','ting-ting','sinji','google 普通话','mandarin'];
var VOICE_PREF_EN=['aria','jenny','guy','ana','michelle','zira','samantha','google us english'];
function pickVoice(lang){
  if(!_voices.length) loadVoices();
  var isZh=(lang||'zh').indexOf('zh')===0;
  /* 家长手动指定优先 */
  var wanted=isZh?(S.voiceZh||''):(S.voiceEn||'');
  if(wanted){ for(var w=0;w<_voices.length;w++){ if(_voices[w].name===wanted) return _voices[w]; } }
  var cand=_voices.filter(function(v){ return (v.lang||'').toLowerCase().indexOf(isZh?'zh':'en')===0; });
  if(!cand.length) return null;
  /* 1. Natural / Online 在线播音音色（Edge）最优 */
  for(var i=0;i<cand.length;i++){ var n=cand[i].name.toLowerCase(); if(n.indexOf('natural')>=0||n.indexOf('online')>=0){ if(isZh && (n.indexOf('xiaoxiao')>=0||n.indexOf('yunjian')>=0||n.indexOf('yunyang')>=0)) return cand[i]; } }
  for(var i1=0;i1<cand.length;i1++){ var n1=cand[i1].name.toLowerCase(); if(n1.indexOf('natural')>=0||n1.indexOf('online')>=0) return cand[i1]; }
  /* 2. 按偏好名单 */
  var pref=isZh?VOICE_PREF_ZH:VOICE_PREF_EN;
  for(var p=0;p<pref.length;p++){ for(var j=0;j<cand.length;j++){ if(cand[j].name.toLowerCase().indexOf(pref[p])>=0) return cand[j]; } }
  /* 3. 本地服务里的第一个 */
  for(var k2=0;k2<cand.length;k2++){ if(cand[k2].localService) return cand[k2]; }
  return cand[0];
}
/* ---- 在线语音兜底（华为鸿蒙等浏览器常无系统 TTS，点了没声音时自动启用） ---- */
var _aud=null,_audQ=[],_ttsBroken=false;
try{ _ttsBroken=localStorage.getItem('kidsedu_ttsBroken')==='1'; }catch(e){}
function markTtsBroken(v){ _ttsBroken=!!v; try{ localStorage.setItem('kidsedu_ttsBroken',v?'1':'0'); }catch(e){} }
function speakStop(){
  try{ speechSynthesis.cancel(); }catch(e){}
  _audQ=[];
  if(_aud){ try{ _aud.onended=null; _aud.onerror=null; _aud.pause(); }catch(e){} _aud=null; }
}
function splitChunks(text,max){
  var s=String(text),out=[],cur='';
  for(var i=0;i<s.length;i++){
    cur+=s.charAt(i);
    if(cur.length>=max || (cur.length>=40 && '。！？；!?;\n'.indexOf(s.charAt(i))>=0)){ out.push(cur); cur=''; }
  }
  if(cur.replace(/\s/g,'')) out.push(cur);
  return out;
}
function playOnline(text,lang){
  var isZh=(lang||'zh').indexOf('zh')===0;
  _audQ=splitChunks(text,isZh?120:200).map(function(t){
    var e=encodeURIComponent(t);
    return [
      'https://fanyi.baidu.com/gettts?lan='+(isZh?'zh':'en')+'&text='+e+'&spd='+(isZh?4:3)+'&source=web',
      'https://dict.youdao.com/dictvoice?audio='+e+'&le='+(isZh?'zh':'eng')
    ];
  });
  playNextChunk();
}
function playNextChunk(){
  if(!_audQ.length){ _aud=null; return; }
  var urls=_audQ.shift();
  playUrl(urls,0);
}
function playUrl(urls,idx){
  if(idx>=urls.length){ playNextChunk(); return; }
  try{
    _aud=new Audio(urls[idx]);
    _aud.onended=playNextChunk;
    _aud.onerror=function(){ playUrl(urls,idx+1); };  /* 主源失败换备用源 */
    var p=_aud.play();
    if(p&&p.catch) p.catch(function(){ /* 首次可能被自动播放策略拦，下次点击即正常 */ });
  }catch(e){ playUrl(urls,idx+1); }
}
function speak(text,lang,rate){
  speakStop();
  var engine=S.voiceEngine||'auto';
  var lg=lang||'zh-CN';
  if(engine==='online'||(engine==='auto'&&_ttsBroken)){ playOnline(text,lg); return; }
  var v=null;
  try{ v=pickVoice(lg); }catch(e){}
  /* 自动模式下：设备完全没有对应语言的语音包（鸿蒙常见）→ 直接走在线语音 */
  if(engine==='auto' && !v && typeof speechSynthesis!=='undefined'){
    loadVoices();
    var hasLang=_voices.some(function(x){ return (x.lang||'').toLowerCase().indexOf(lg.indexOf('zh')===0?'zh':'en')===0; });
    if(!hasLang && _voices.length===0){ playOnline(text,lg); return; }
  }
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lg; u.rate=rate||0.85; u.pitch=1.05;
    if(v){ u.voice=v; u.pitch=(v.name.toLowerCase().indexOf('natural')>=0||v.name.toLowerCase().indexOf('online')>=0)?1.0:1.05; }
    var started=false;
    u.onstart=function(){ started=true; if(_ttsBroken) markTtsBroken(false); };
    if(engine==='auto'){
      u.onerror=function(){ if(!started){ markTtsBroken(true); playOnline(text,lg); } };
      setTimeout(function(){
        /* 2.5秒还没真正开始发声 → 判定系统TTS失效，改用在线语音并记住（下次直接走在线） */
        if(!started){ try{ speechSynthesis.cancel(); }catch(e){} markTtsBroken(true); playOnline(text,lg); }
      },2500);
    }
    speechSynthesis.speak(u);
  }catch(e){ playOnline(text,lg); }
}
var _actx=null;
function chime(kind){
  try{
    if(!_actx) _actx=new (window.AudioContext||window.webkitAudioContext)();
    var notes=kind==='win'?[523,659,784,1047]:(kind==='no'?[330,262]:[660,880]);
    for(var i=0;i<notes.length;i++){
      (function(f,d){
        var o=_actx.createOscillator(), g=_actx.createGain();
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0.25,_actx.currentTime+d);
        g.gain.exponentialRampToValueAtTime(0.001,_actx.currentTime+d+0.28);
        o.connect(g); g.connect(_actx.destination);
        o.start(_actx.currentTime+d); o.stop(_actx.currentTime+d+0.3);
      })(notes[i], i*0.12);
    }
  }catch(e){}
}
function confetti(big){
  var ems=['🎉','⭐','🌟','🎈','💖','✨','🎊','🌸'];
  var n=big?26:14;
  for(var i=0;i<n;i++){
    var s=document.createElement('span');
    s.className='confetti';
    s.textContent=ems[Math.floor(Math.random()*ems.length)];
    s.style.left=(2+Math.random()*95)+'vw';
    s.style.top=(-2+Math.random()*18)+'vh';
    s.style.animationDelay=(Math.random()*0.45)+'s';
    s.style.fontSize=(20+Math.random()*16)+'px';
    document.body.appendChild(s);
    (function(el){setTimeout(function(){el.remove();},2100);})(s);
  }
}
function celebrate(msg,big){
  confetti(big); chime('win');

  if(msg) toast(msg);
}

/* ==================== 打卡 / 连续天数 / 勋章 ==================== */
function habitsToday(k){ return k.habits[today()]||[]; }
function totalHabitDays(k){ return Object.keys(k.habits).length; }
function streak(k){
  var n=0, d=new Date();
  var key=today();
  if(!(k.habits[key]&&k.habits[key].length)) d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){
    key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(k.habits[key]&&k.habits[key].length){ n++; d.setDate(d.getDate()-1); }
    else break;
  }
  if(k.habits[today()]&&k.habits[today()].length) n++;
  return n;
}
function checkBadges(k){
  for(var i=0;i<BADGES.length;i++){
    var b=BADGES[i];
    if(!k.badges[b.id] && b.cond(k)){
      k.badges[b.id]=today(); save();
      openModal('<div style="font-size:70px" class="bounce">'+b.icon+'</div>'+
        '<h2 style="justify-content:center">'+esc(kidLabel(k))+' 解锁新勋章！</h2>'+
        '<p style="font-size:18px;font-weight:800;margin:6px 0">'+b.name+'</p>'+
        '<p class="hint">'+b.desc+'</p>'+
        '<button class="btn yellow mt" onclick="closeModal()">太棒啦！</button>');
      speak('恭喜'+k.name+'，解锁新勋章：'+b.name); confetti(true);
    }
  }
}
function doHabit(id){
  var k=K(); ensureDay(k);
  var arr=k.habits[today()]||(k.habits[today()]=[]);
  if(arr.indexOf(id)>=0){ toast('这项今天已经打过卡啦～'); return; }
  var hb=null;
  for(var i=0;i<HABITS.length;i++) if(HABITS[i].id===id) hb=HABITS[i];
  arr.push(id);
  addPts(k,hb?hb.pts:5);
  save();
  celebrate('打卡成功 +'+(hb?hb.pts:5)+'分');
  checkBadges(k);
  if(Math.random()<0.35){ setTimeout(openBlindBox,700); }
  render();
}
function openBlindBox(){
  chime();
  openModal('<div style="font-size:76px" class="bounce">🎁</div>'+

function revealBlindBox(){

function dueReviews(k){
  var t=today(), out=[];
  for(var i=0;i<k.review.length;i++) if(k.review[i].due<=t) out.push(k.review[i]);
  return out;
}
function planItems(k){
  var due=dueReviews(k).length;
  return [
    {icon:'📖', name:'认识 '+k.goal.chars+' 个新字', cur:Math.min(k.stats.chars,k.goal.chars), max:k.goal.chars, go:"goStudy('hanzi')"},
    {icon:'🔁', name:'复习不熟练的字', cur:due===0?1:0, max:1, extra:due>0?('还有 '+due+' 张卡'):'', go:"goStudy('hanzi')"},
    {icon:'📜', name:'古诗跟读 '+k.goal.poems+' 首', cur:Math.min(k.stats.poems,k.goal.poems), max:k.goal.poems, go:"goStudy('poem')"},
    {icon:'🅰️', name:'英语单词 '+k.goal.words+' 个', cur:Math.min(k.stats.wordSet.length,k.goal.words), max:k.goal.words, go:"goStudy('english')"},
    {icon:'🔢', name:'完成 1 轮口算', cur:k.stats.mathDone?1:0, max:1, go:"goStudy('math')"},
    {icon:'💪', name:'习惯打卡 '+HABITS.length+' 项', cur:habitsToday(k).length, max:HABITS.length, go:"go('habit')"}
  ];
}
function checkAllDone(k){
  var items=planItems(k), all=true;
  for(var i=0;i<items.length;i++) if(items[i].cur<items[i].max) all=false;
  if(all && !k.stats.allDone){
    k.stats.allDone=true; addPts(k,20); save();
    celebrate(kidLabel(k)+' 今日计划全部完成！奖励 +20 分',true);
  }
}

    h+='<button class="'+(p===page?'on':'')+'" onclick="'+fn+'('+p+')">'+(p+1)+'</button>';

    }else{

    }

      '<button class="btn green" onclick="startMath(5)">🍭 5以内</button>'+

      '<p class="center mt">'+(k.stats.mathDone?'<span class="done-tag">✅ 今日口算任务已完成</span>':'<span class="hint">今日口算任务还没完成哦</span>')+'</p>';
  }else{
    var q=MQ.qs[MQ.i];
    h+='<p class="center hint">第 '+(MQ.i+1)+' / '+MQ.qs.length+' 题 · 已答对 '+MQ.right+' 题</p>'+
      '<div class="mathq">'+q.a+' '+q.op+' '+q.b+' = ?</div><div class="mopts">';
    for(var m=0;m<q.opts.length;m++) h+='<button onclick="answerMath('+q.opts[m]+')">'+q.opts[m]+'</button>';
    h+='</div>';
  }
  return h+'</div>';
}
function setSplit(n){ splitN=n; render(); }
function splitTap(a,b){ chime(); speak((a+b)+'，可以分成'+a+'和'+b+'。'+a+'加'+b+'等于'+(a+b),'zh-CN',0.8); }
function startMath(max){
  var qs=[];
  for(var i=0;i<8;i++){
    var add=Math.random()<0.55, a,b,ans;
    if(add){ a=1+Math.floor(Math.random()*(max-1)); b=1+Math.floor(Math.random()*(max-a)); ans=a+b; }
    else{ a=2+Math.floor(Math.random()*(max-1)); if(a>max)a=max; b=1+Math.floor(Math.random()*(a-1)); ans=a-b; }
    var opts=[ans];
    while(opts.length<3){
      var d=ans+Math.floor(Math.random()*7)-3;
      if(d>=0 && d<=max+3 && opts.indexOf(d)<0) opts.push(d);
    }
    opts.sort(function(){return Math.random()-0.5;});
    qs.push({a:a,b:b,op:add?'+':'-',ans:ans,opts:opts});
  }
  MQ={qs:qs,i:0,right:0,end:false};
  render();
}
function answerMath(v){
  var k=K(); ensureDay(k);
  var q=MQ.qs[MQ.i];
  if(v===q.ans){
    MQ.right++; k.cnt.mathRight++;
    addPts(k,1); confetti(); chime('win'); speak('答对啦！');
  }else{
    chime('no'); speak('再想一想，正确答案是'+q.ans);
    toast('正确答案是 '+q.ans);
  }
  MQ.i++;
  if(MQ.i>=MQ.qs.length){
    MQ.end=true;
    if(MQ.right>=6 && !k.stats.mathDone){
      k.stats.mathDone=true; addPts(k,10);
      setTimeout(function(){celebrate('口算达标 +10分！',true);},400);
    }
  }
  save(); checkBadges(k); checkAllDone(k); render();
}

function startTV(){
  var k=K();
  if(tvRunning) return;
  if(tvAvail(k)<=0){ eyePopup(); return; }
  tvRunning=true; tvSession=0;
  tvTimer=setInterval(tvTick,1000);
  render();
}
function tvTick(){
  var k=K();
  if(!k.tv.used) k.tv.used={};
  k.tv.used[today()]=tvUsed(k)+1;
  k.tv.bank=Math.max(0,k.tv.bank-1);
  tvSession++;
  if(tvUsed(k)%15===0) save();
  var el=document.getElementById('tvClock');
  if(el) el.textContent=fmt(tvAvail(k));
  var u=document.getElementById('tvUsedTxt');
  if(u) u.textContent=fmt(tvUsed(k));
  if(tvAvail(k)<=0){ stopTV(true); return; }
  if(tvSession===k.tv.limit*60){ stopTV(true); }
}
function stopTV(over,silent){
  if(tvTimer){ clearInterval(tvTimer); tvTimer=null; }
  tvRunning=false; save();
  if(silent) return;
  if(over) eyePopup();
  else{ toast('休息一下，看看窗外的绿色～'); render(); }

function exportData(){
  try{
    var blob=new Blob([JSON.stringify(localStorage)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='kidsedu-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href); document.body.removeChild(a);},100);
    toast('备份文件已下载');
  }catch(e){ toast('导出失败'); }
}
function importData(el){
  var f=el.files&&el.files[0]; if(!f){return;}
  if(!confirm('导入会覆盖当前设备的全部数据，确定继续？建议先导出当前备份。')){ el.value=''; return; }
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      for(var key in data){ localStorage.setItem(key, data[key]); }
      toast('导入成功，正在重启…');
      setTimeout(function(){ location.reload(); },800);
    }catch(e){ toast('文件格式不对'); }
    el.value='';
  };
  r.readAsText(f);
}

  if(arr.indexOf(hid)>=0){ toast('这一项当天已有打卡记录'); return; }

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}

/* ==================== 安装到桌面引导（iOS / 微信 / Android） ==================== */
(function(){
  try{
    var ua=navigator.userAgent||'';
    var isStandalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
    if(isStandalone) return;                            /* 已经装到桌面，不提示 */
    if(localStorage.getItem('kidsedu_a2hs_dismiss')) return;  /* 用户关过，不再骚扰 */
    var isIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&'ontouchend' in document);
    var isWeChat=/MicroMessenger/i.test(ua);
    var isQQ=/ QQ\//i.test(ua)||/QQBrowser/i.test(ua);
    var isIOSSafari=isIOS&&!/CriOS|FxiOS|EdgiOS|MicroMessenger|QQ/i.test(ua);
    var isIOSOtherBrowser=isIOS&&/CriOS|FxiOS|EdgiOS/i.test(ua);
    var msg='';
    if(isWeChat||isQQ){
      msg='<b>想把「学习乐园」装到桌面？</b><br>请点右上角 <b>···</b> 菜单，选择<b>「在浏览器打开」</b>'+(isIOS?'（用 Safari 打开）':'')+'，再按提示添加到桌面哦。';
    }else if(isIOSSafari){
      msg='<b>把「学习乐园」装到 iPhone/iPad 桌面：</b><br>1️⃣ 点击底部中间的 <b>分享按钮</b> <span style="display:inline-block;border:1.5px solid #59a8dd;border-radius:5px;padding:0 5px;font-weight:700">⎋</span>（方框加向上箭头）<br>2️⃣ 在菜单里<b>向下滑动</b>，找到<b>「添加到主屏幕」</b><br>3️⃣ 点右上角「添加」就完成啦 🎉';
    }else if(isIOSOtherBrowser){
      msg='<b>提示：</b>建议改用 iPhone 自带的 <b>Safari 浏览器</b>打开本页，点底部「分享」→「添加到主屏幕」，即可装到桌面。';
    }
    if(!msg) return;
    var bar=document.createElement('div');
    bar.id='a2hsTip';
    bar.style.cssText='position:fixed;left:10px;right:10px;bottom:86px;z-index:9999;background:#fffefb;border:2px solid #9fd6f7;border-radius:16px;box-shadow:0 8px 24px rgba(90,150,200,.25);padding:12px 40px 12px 14px;font-size:14px;line-height:1.7;color:#3a5a74;animation:a2hsIn .4s ease';
    bar.innerHTML=msg+'<div onclick="document.getElementById(\'a2hsTip\').remove();localStorage.setItem(\'kidsedu_a2hs_dismiss\',\'1\')" style="position:absolute;top:6px;right:8px;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:#eef6fc;font-weight:700;cursor:pointer">✕</div>';
    var st=document.createElement('style');
    st.textContent='@keyframes a2hsIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}';
    document.head.appendChild(st);
    document.body.appendChild(bar);
    if(isIOSSafari){
      /* 底部小箭头指向 Safari 分享按钮位置 */
      var arrow=document.createElement('div');
      arrow.id='a2hsArrow';
      arrow.textContent='⬇️';
      arrow.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:52px;z-index:9999;font-size:26px;animation:a2hsBounce 1s infinite';
      st.textContent+='@keyframes a2hsBounce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}';
      document.body.appendChild(arrow);
      var oldRm=bar.querySelector('div[onclick]');
      oldRm.setAttribute('onclick',oldRm.getAttribute('onclick')+";var a=document.getElementById('a2hsArrow');if(a)a.remove();");
    }
  }catch(e){}
})();
</script>
</body>
</html>
